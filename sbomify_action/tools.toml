# Single source of truth for every external tool this project depends on.
#
# Versions, download locations and digests used to live in four places at
# once -- Dockerfile ARGs, runtimes.py, scripts/generate_additional_packages.sh
# and bin/check_tool_versions.py -- and they drifted. Moving cosign and crane
# to on-demand fetching dropped them out of version monitoring entirely, and
# both went stale unnoticed. A stale pin is worse than a stale apt package,
# because the digest guarantees we keep installing the old bytes forever.
#
# `stage` is the load-bearing field:
#
#   image    baked into the container at build time. Present in every pull,
#            whether or not it is used.
#   runtime  fetched on first use into an unprivileged prefix and verified
#            against the digest below. Only downloaded by runs that need it.
#   build    used to build the image and not shipped in it.
#
# That split is exactly the boundary between the build SBOM and the runtime
# SBOM: the image manifest cannot describe a tool that is fetched later, and
# the runtime manifest must not claim tools the run never touched.
#
# Fields:
#   version         pinned version, without a leading "v"
#   stage           image | runtime | build (see above)
#   purl            package URL for the SBOM; "{version}" is substituted
#   github_repo     owner/name, used by bin/check_tool_versions.py
#   dockerfile_arg  the ARG that must carry this version (image/build only)
#   kind            runtime only: raw | tar.gz | tar.xz | zip
#   member          runtime only: the single archive entry to keep
#   assets          runtime only: per-arch url + sha256

[tool.syft]
version_from = { file = "tools/go.mod", module = "github.com/anchore/syft" }
stage = "image"
purl = "pkg:golang/github.com/anchore/syft@v{version}"
github_repo = "anchore/syft"
dockerfile_arg = "SYFT_VERSION"

[tool.cargo-cyclonedx]
version_from = { file = "tools/Cargo.lock", package = "cargo-cyclonedx" }
stage = "image"
purl = "pkg:cargo/cargo-cyclonedx@{version}"
github_repo = "CycloneDX/cyclonedx-rust-cargo"
dockerfile_arg = "CARGO_CYCLONEDX_VERSION"

[tool.uv]
version = "0.10.8"
stage = "build"
purl = "pkg:pypi/uv@{version}"
github_repo = "astral-sh/uv"
dockerfile_arg = "UV_VERSION"

# ---------------------------------------------------------------------------
# Runtime tools. Fetched on demand; see sbomify_action/runtimes.py.
#
# Digests come from the vendor's published checksum file and must be updated
# together with the version -- bin/check_tool_versions.py will tell you when a
# release is available, but it deliberately will not rewrite a digest for you.
# ---------------------------------------------------------------------------

[tool.cosign]
# Version comes from tools/go.mod -- do not restate it here.
version_from = { file = "tools/go.mod", module = "github.com/sigstore/cosign/v3" }
stage = "runtime"
purl = "pkg:golang/github.com/sigstore/cosign@v{version}"
github_repo = "sigstore/cosign"
kind = "raw"

[tool.cosign.assets.amd64]
url = "https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64"
sha256 = "ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc"

[tool.cosign.assets.arm64]
url = "https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-arm64"
sha256 = "2ec865872e331c32fd12b08dae15332d3f92c0aa029219589684a4903ca85d11"

[tool.crane]
version_from = { file = "tools/go.mod", module = "github.com/google/go-containerregistry" }
stage = "runtime"
purl = "pkg:golang/github.com/google/go-containerregistry@v{version}"
github_repo = "google/go-containerregistry"
kind = "tar.gz"
member = "crane"

[tool.crane.assets.amd64]
url = "https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz"
sha256 = "1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230"

[tool.crane.assets.arm64]
url = "https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_arm64.tar.gz"
sha256 = "b6ee979d9411dfb05ce35ab9e156fe5de7def11a230764a7856ffa2eb971fa88"

# ---------------------------------------------------------------------------
# Ecosystem tooling, all fetched on demand.
#
# These used to be acquired two different bad ways: cdxgen was baked into the
# image as 619MB of bun + node_modules that every user pulled whether or not
# they had a JavaScript project, while the JDK, Maven and Go were `apt-get
# install`ed *during a run* -- unpinned, absent from every SBOM, and requiring
# the container to run as root.
#
# Now each is a pinned artifact fetched only by runs that need it. Nothing
# here is in the image, so nothing here appears in the image's SBOM.
# ---------------------------------------------------------------------------

[tool.cdxgen]
version = "12.8.2"
stage = "runtime"
purl = "pkg:npm/%40cyclonedx/cdxgen@{version}"
github_repo = "CycloneDX/cdxgen"
kind = "raw"

# The "slim" build, 35.6MB against 619MB for bun + node_modules. Verified to
# produce identical component counts on java, javascript, ruby and elixir.
[tool.cdxgen.assets.amd64]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.8.2/cdxgen-linux-amd64-slim"
sha256 = "4b49a3cc09e4f5f8815058edf0a6d2feecc843f3eecf7649b75c86e21383b381"

[tool.cdxgen.assets.arm64]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.8.2/cdxgen-linux-arm64-slim"
sha256 = "d9bac95eaceef2a0eddf16b6a22e0ef1549ad827d488f44cb65be759f42aecd2"

# Full JDK rather than the 52MB JRE: Maven resolution would be happy with a
# JRE, but Gradle needs javac. Only Java and Scala projects pay for it.
[tool.java]
version = "21.0.12+8"
stage = "runtime"
purl = "pkg:generic/temurin@{version}?distro=eclipse-temurin"
github_repo = "adoptium/temurin21-binaries"
kind = "tar.gz"
strip_container = true
# Maven and Gradle look for JAVA_HOME rather than trusting PATH.
env = { JAVA_HOME = "{prefix}" }

[tool.java.assets.amd64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12_8.tar.gz"
sha256 = "e4446ff06a276155697597cc0f1b15da004ff083f4964a35271ecee567177370"

[tool.java.assets.arm64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.12_8.tar.gz"
sha256 = "eba38e871b02d407897bfe017ea35352dfc1420ef6d2112425b0c67325ca509d"

# Apache publishes only sha512 for Maven, so that is what we pin against.
# The tarball is architecture-independent; both entries are the same file.
[tool.maven]
version_from = { file = "tools/pom.xml", artifact = "apache-maven" }
stage = "runtime"
purl = "pkg:maven/org.apache.maven/apache-maven@{version}"
github_repo = "apache/maven"
kind = "tar.gz"
strip_container = true
# Maven's local repository defaults to $HOME/.m2. Running non-root the home
# directory is usually "/", so Maven dies with "Could not create local
# repository at /.m2/repository". Keep it inside the runtime prefix, which is
# writable by construction. MAVEN_ARGS is read by Maven 3.9+.
env = { MAVEN_ARGS = "-Dmaven.repo.local={prefix}/repository" }

[tool.maven.assets.amd64]
url = "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz"
sha512 = "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b"

[tool.maven.assets.arm64]
url = "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz"
sha512 = "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b"

[tool.go]
version = "1.24.13"
stage = "runtime"
purl = "pkg:generic/go@{version}"
github_repo = "golang/go"
kind = "tar.gz"
strip_container = true

[tool.go.assets.amd64]
url = "https://go.dev/dl/go1.24.13.linux-amd64.tar.gz"
sha256 = "1fc94b57134d51669c72173ad5d49fd62afb0f1db9bf3f798fd98ee423f8d730"

[tool.go.assets.arm64]
url = "https://go.dev/dl/go1.24.13.linux-arm64.tar.gz"
sha256 = "74d97be1cc3a474129590c67ebf748a96e72d9f3a2b6fef3ed3275de591d49b3"

# cargo-cyclonedx is a cargo subcommand: it shells out to `cargo metadata` for
# the dependency graph and to `rustc` for the host target triple, and fails
# without either. Baking a rustup toolchain in to satisfy a 7MB subcommand
# costs ~630MB, more than the whole rest of the image.
#
# These two standalone dist tarballs are 92MB together. rust-std is
# deliberately absent: cargo-cyclonedx compiles nothing, and dropping it saves
# a further 181MB -- verified by removing lib/rustlib from a full toolchain,
# which changes nothing, while removing the rest of lib/ breaks it.
[tool.rust]
version = "1.97.1"
stage = "runtime"
purl = "pkg:generic/rust@{version}"
github_repo = "rust-lang/rust"
kind = "tar.xz"
rust_dist = true
bin_subdir = "bin"
# cargo writes its registry index to CARGO_HOME, which defaults to $HOME/.cargo
# and is unwritable when HOME is "/".
env = { CARGO_HOME = "{prefix}/.cargo" }

[[tool.rust.assets.amd64]]
url = "https://static.rust-lang.org/dist/cargo-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "e1be5f5ff7f7f80ca506fb65770b759edbdc6d303781ed71c5de8ec8a8394779"

[[tool.rust.assets.amd64]]
url = "https://static.rust-lang.org/dist/rustc-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "9819d0a32d56bd339585319c80260e332779f5541fd66838ab7e016d6c814819"

[[tool.rust.assets.arm64]]
url = "https://static.rust-lang.org/dist/cargo-1.97.1-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "8f70bcaccea5ba4db187c3fd4d64e24592b4e16af513497201f5909d61691dbe"

[[tool.rust.assets.arm64]]
url = "https://static.rust-lang.org/dist/rustc-1.97.1-aarch64-unknown-linux-gnu.tar.xz"
sha256 = "b344b81f0cd4c2246c7da8b197fe7a339d7dd02bb15cb69b2524115d9c75224c"
