---
name: Publish Python distribution to PyPI and TestPyPI

on:
  release:
    types: [published]
  push:
    branches:
      - master

jobs:
  build-and-publish-testpypi:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    needs: sbom
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sbomify-action
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing and PEP 740 attestations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Overwrites the committed placeholder sbomify-action.cdx.json, which the
      # Dockerfile's `COPY . /app/` and hatch's sbom-files pick up
      - name: Download SBOM (PEP 770)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pep770-sbom

      - name: Determine version
        id: version
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          # Get base version from pyproject.toml and append dev suffix with short SHA
          BASE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          SHORT_SHA=$(echo "${GH_SHA}" | cut -c1-7)
          # Use .devN format where N is derived from SHA (convert hex to decimal, truncate)
          DEV_NUM=$(printf "%d" 0x${SHORT_SHA} 2>/dev/null | cut -c1-9)
          VERSION="${BASE_VERSION}.dev${DEV_NUM}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build wheel using Docker
        run: |
          docker build \
            --target builder \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            -t sbomify-builder .

      - name: Extract wheel from Docker image
        run: |
          container_id=$(docker create sbomify-builder)
          docker cp ${container_id}:/app/dist/ ./dist/
          docker rm ${container_id}
          echo "Built artifacts:"
          ls -la dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true  # PEP 740 digital attestations

  build-and-publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: sbom
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/sbomify-action
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing and PEP 740 attestations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Overwrites the committed placeholder sbomify-action.cdx.json, which the
      # Dockerfile's `COPY . /app/` and hatch's sbom-files pick up
      - name: Download SBOM (PEP 770)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pep770-sbom

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Use version from pyproject.toml, which must match the release tag
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "${RELEASE_TAG#v}" != "${VERSION}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match pyproject.toml version ${VERSION}. Bump the version, then tag that commit."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build wheel using Docker
        run: |
          docker build \
            --target builder \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            -t sbomify-builder .

      - name: Extract wheel from Docker image
        run: |
          container_id=$(docker create sbomify-builder)
          docker cp ${container_id}:/app/dist/ ./dist/
          docker rm ${container_id}
          echo "Built artifacts:"
          ls -la dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true  # PEP 740 digital attestations

  # Generates the SBOM baked into the wheel either job above publishes, from
  # this commit's own source rather than the published action or image. It
  # holds no id-token: the right to mint a PyPI publishing token stays with the
  # publish jobs, which only download the result.
  sbom:
    name: Generate SBOM (PEP 770)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract tool versions
        run: |
          source ./scripts/generate_additional_packages.sh
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          # No cache in a release workflow: a poisoned one would reach the wheel
          enable-cache: false

      - name: Generate SBOM (PEP 770)
        env:
          # Release -> production sbomify; master push -> staging (TestPyPI).
          # Each token is read only on its own event and chosen in the script:
          # `release && SBOMIFY_TOKEN || SBOMIFY_STAGE_TOKEN` would fall back to
          # the staging token, sent to production, if the first were ever empty.
          EVENT_NAME: ${{ github.event_name }}
          PROD_TOKEN: ${{ github.event_name == 'release' && secrets.SBOMIFY_TOKEN || '' }}
          STAGE_TOKEN: ${{ github.event_name != 'release' && secrets.SBOMIFY_STAGE_TOKEN || '' }}
          COMPONENT_NAME: 'sbomify Action'
          LOCK_FILE: uv.lock
          SBOM_FORMAT: cyclonedx
          OUTPUT_FILE: sbomify-action.cdx.json
          AUGMENT: "true"
          ENRICH: "true"
          UPLOAD: "false"
        run: |
          # Component IDs are per environment, as in sboms.yml's "sbomify Action" rows
          if [[ "${EVENT_NAME}" == "release" ]]; then
            export TOKEN="${PROD_TOKEN}" API_BASE_URL="https://app.sbomify.com" COMPONENT_ID="Gu9wem8mkX"
          else
            export TOKEN="${STAGE_TOKEN}" API_BASE_URL="https://stage.sbomify.com" COMPONENT_ID="XNsX40tonzvv"
          fi
          # Without a token the CLI skips augmentation and still passes, so the
          # wheel would ship a bare SBOM; e.g. a secret scoped to an environment
          # this job doesn't use.
          : "${TOKEN:?sbomify token missing for ${EVENT_NAME}}"
          # The placeholder is committed, so remove it: the upload below then
          # fails if generation didn't write the file. Install first, because
          # hatchling's editable build needs the sbom-files path to exist, and
          # run without re-syncing.
          uv sync --frozen --no-dev
          rm -f sbomify-action.cdx.json
          uv run --frozen --no-dev --no-sync sbomify-action

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pep770-sbom
          path: sbomify-action.cdx.json
          if-no-files-found: error
          retention-days: 7
