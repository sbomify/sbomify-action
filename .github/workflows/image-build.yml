---
# Builds the sbomify-action image for linux/amd64 and linux/arm64 and, when
# push is true, publishes one multi-arch manifest as <image_tag> on GHCR and
# the Docker Hub mirror. Called by the CI/CD Pipeline (master and PRs) and by
# the Release workflow, which pins the returned digest into action.yml.
name: Build Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: VERSION build-arg baked into the image
        type: string
        required: true
      image_tag:
        description: Tag to publish, e.g. latest or 26.10.3
        type: string
        required: true
      ref:
        description: Commit SHA to build
        type: string
        required: true
      push:
        description: Publish to the registries; false only builds
        type: boolean
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      digest:
        description: Manifest digest (sha256:...), the same on GHCR and Docker Hub; empty when push is false
        value: ${{ jobs.push-images.outputs.digest }}

env:
  IMAGE_NAME: sbomify-action

jobs:
  meta:
    name: Image Metadata
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ghcr_repo: ${{ steps.meta.outputs.ghcr_repo }}
      dockerhub_repo: ${{ steps.meta.outputs.dockerhub_repo }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Prepare build metadata
        id: meta
        env:
          GH_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          GHCR_REPO="ghcr.io/$(echo "${GH_REPO_OWNER}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_REPO="sbomifyhub/${IMAGE_NAME}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          {
            echo "ghcr_repo=${GHCR_REPO}"
            echo "dockerhub_repo=${DOCKERHUB_REPO}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

  build-images:
    name: Build Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: meta
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: sbomifyhub
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # On pull_request this builds only -- no registry, no push -- so the
      # arm64 image is actually compiled in review. Pushing by digest stays
      # limited to callers that set push, where the registry secrets exist.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            runnumber=${{ github.run_id }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT_SHA=${{ inputs.ref }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
            VCS_REF=${{ github.ref_name }}
          outputs: ${{ inputs.push && format('type=image,"name={0},{1}",push-by-digest=true,name-canonical=true,push=true', needs.meta.outputs.ghcr_repo, needs.meta.outputs.dockerhub_repo) || 'type=cacheonly' }}
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: ${{ inputs.push && format('type=gha,mode=max,scope=build-{0}', matrix.slug) || '' }}

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - meta
      - build-images
    if: inputs.push
    permissions:
      packages: write
      contents: read
      id-token: write      # Sigstore signing certificate
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      GHCR_REPO: ${{ needs.meta.outputs.ghcr_repo }}
      DOCKERHUB_REPO: ${{ needs.meta.outputs.dockerhub_repo }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: sbomifyhub
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "::error::No digest files found. The digests-* artifacts may have expired" \
              "(retention is 7 days) — re-run all jobs, not just this one."
            exit 1
          fi
          echo "Found ${#digests[@]} digest(s): ${digests[*]}"
          docker buildx imagetools create -t "${GHCR_REPO}:${IMAGE_TAG}" \
            $(printf -- "${GHCR_REPO}@sha256:%s " "${digests[@]}")
          docker buildx imagetools create -t "${DOCKERHUB_REPO}:${IMAGE_TAG}" \
            $(printf -- "${DOCKERHUB_REPO}@sha256:%s " "${digests[@]}")

      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect "${GHCR_REPO}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${DOCKERHUB_REPO}:${IMAGE_TAG}"

      # Both registries get the same manifest list built from the same
      # per-platform digests, so they must report the same digest. The
      # Release workflow pins it, and a pin that only matches one registry
      # would leave Bitbucket pipe users on a different image.
      - name: Read manifest digest
        id: digest
        run: |
          GHCR_DIGEST=$(docker buildx imagetools inspect "${GHCR_REPO}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          HUB_DIGEST=$(docker buildx imagetools inspect "${DOCKERHUB_REPO}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          if [[ "${GHCR_DIGEST}" != sha256:* || "${GHCR_DIGEST}" != "${HUB_DIGEST}" ]]; then
            echo "::error::Manifest digests differ or are missing: ${GHCR_REPO}:${IMAGE_TAG} is '${GHCR_DIGEST}'," \
              "${DOCKERHUB_REPO}:${IMAGE_TAG} is '${HUB_DIGEST}'."
            exit 1
          fi
          echo "digest=${GHCR_DIGEST}" >> "$GITHUB_OUTPUT"

      # SLSA provenance for the multi-arch digest that releases pin, signed
      # through Sigstore and stored both with GitHub and next to the image in
      # each registry. A storage record would also need artifact-metadata:
      # write, so it is left off.
      - name: Attest provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_REPO }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: Fulcio issues the certificate to this workflow's OIDC
      # identity, so there is no signing key to store or leak.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${GHCR_REPO}@${DIGEST}" "${DOCKERHUB_REPO}@${DIGEST}"

      # Each platform's provenance and SBOM sit in the index as an extra
      # manifest whose platform is unknown/unknown; they are not platforms.
      - name: Image summary
        run: |
          PLATFORMS=$(docker buildx imagetools inspect "${GHCR_REPO}:${IMAGE_TAG}" \
            --format '{{range .Manifest.Manifests}}{{if ne .Platform.OS "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')
          {
            echo '```'
            echo "Primary:   ${GHCR_REPO}:${IMAGE_TAG}"
            echo "Mirror:    ${DOCKERHUB_REPO}:${IMAGE_TAG}"
            echo "Platforms: ${PLATFORMS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
