# Generated by `sbomify-action wizard`. Re-run the wizard to update.
# sbomify-action wizard v1
#
# Dogfood SBOM generation for this repo, migrated from the inline jobs that
# used to live in sbomify.yaml. Two environments:
#   * staging    — every push to master  -> stage.sbomify.com
#   * production — version tags (v*)      -> sbomify.com
#
# Container components generate an SBOM from the published ghcr image
# (ghcr.io/sbomify/sbomify-action:<tag>), which is built and pushed by the
# CI/CD Pipeline workflow's push-images job. To guarantee that image exists
# first, this workflow is gated on workflow_run — it only starts after
# CI/CD Pipeline completes successfully, the cross-workflow equivalent of
# `needs: push-images`.
#
# Because it triggers on workflow_run, GitHub always runs the copy of this
# file on the repo's DEFAULT branch — changes only take effect once merged
# to master. Under workflow_run github.ref is the default branch (not the
# triggering tag), so version/docker_tag are derived from the
# workflow_run payload below rather than the determine-version action, and
# checkout pins head_sha so the workspace matches the built commit/tag.
name: sboms
on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
jobs:
  # =========================================================================
  # Staging — master branch builds only -> stage.sbomify.com
  # =========================================================================
  sbom-staging:
    name: ${{ matrix.name }}-staging
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the GitHub OIDC JWT
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: action-cyclonedx
            kind: source
            is_action: true
            component_name: sbomify Action
            component_id: XNsX40tonzvv
            lockfile: uv.lock
            sbom_format: cyclonedx
            output_file: sbomify-action.cdx.json
          - name: action-spdx
            kind: source
            is_action: true
            component_name: sbomify Action
            component_id: XNsX40tonzvv
            lockfile: uv.lock
            sbom_format: spdx
            output_file: sbomify-action.spdx.json
          - name: javascript-cyclonedx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            component_id: PGyKXNbQd5eq
            lockfile: bun.lock
            sbom_format: cyclonedx
            output_file: sbomify-action-frontend.cdx.json
          - name: javascript-spdx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            component_id: PGyKXNbQd5eq
            lockfile: bun.lock
            sbom_format: spdx
            output_file: sbomify-action-frontend.spdx.json
          - name: container-cyclonedx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            component_id: gco2pG10whmy
            sbom_format: cyclonedx
            output_file: sbomify-action-container.cdx.json
          - name: container-spdx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            component_id: gco2pG10whmy
            sbom_format: spdx
            output_file: sbomify-action-container.spdx.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .sbomify-cache
          key: sbomify-${{ runner.os }}
      - name: Generate additional packages from Dockerfile
        if: matrix.kind == 'container'
        run: ./scripts/generate_additional_packages.sh > container_additional_packages.txt
      # Derive version/docker_tag from the workflow_run payload. Under
      # workflow_run github.ref is the default branch, so the
      # determine-version action would always report a staging build —
      # replicate its logic against head_branch/head_sha instead.
      - id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [[ "$HEAD_BRANCH" == v* ]]; then
            echo "version=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "docker_tag=${HEAD_BRANCH#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "docker_tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: sbomify/sbomify-action@master
        env:
          API_BASE_URL: https://stage.sbomify.com
          OIDC_AUDIENCE: stage.sbomify.com
          COMPONENT_ID: ${{ matrix.component_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.version.outputs.version }}
          COMPONENT_PURL: ${{ (matrix.kind == 'container' || matrix.is_action) && format('pkg:docker/sbomify/sbomify-action@{0}?repository_url=ghcr.io', steps.version.outputs.docker_tag) || '' }}
          DOCKER_IMAGE: ${{ matrix.kind == 'container' && format('ghcr.io/sbomify/sbomify-action:{0}', steps.version.outputs.docker_tag) || '' }}
          LOCK_FILE: ${{ matrix.lockfile }}
          ADDITIONAL_PACKAGES_FILE: ${{ matrix.kind == 'container' && 'container_additional_packages.txt' || '' }}
          PRODUCT_RELEASE: '["Engh9j4XTTwD:${{ steps.version.outputs.version }}"]'
          SBOM_FORMAT: ${{ matrix.sbom_format }}
          UPLOAD: 'true'
          AUGMENT: 'true'
          ENRICH: 'true'
          OUTPUT_FILE: ${{ matrix.output_file }}
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache
          SYFT_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache/syft
      # ---------------------------------------------------------------------
      # Build-provenance attestation (SLSA v1)
      # ---------------------------------------------------------------------
      # Where this step is supported:
      #   * Public repository on any GitHub plan (Free, Pro, Team, Enterprise)
      #     — uses the public-good Sigstore instance (Fulcio + Rekor public log).
      #   * Private / internal repository on GitHub Enterprise Cloud
      #     — uses GitHub's private Sigstore instance (scoped to the repo).
      # Where it is NOT supported and the workflow will fail:
      #   * Private / internal repository on GitHub Free, Pro, or Team.
      #   * Any repository on GitHub Enterprise Server (self-hosted).
      # If you hit one of the unsupported configurations, either upgrade to
      # GitHub Enterprise Cloud, make the repo public, or remove this step.
      # Reference: https://github.com/actions/attest-build-provenance
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: '${{ github.workspace }}/${{ matrix.output_file }}'

  # =========================================================================
  # Production — version tags only -> sbomify.com
  # =========================================================================
  sbom-production:
    name: ${{ matrix.name }}-production
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the GitHub OIDC JWT
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: action-cyclonedx
            kind: source
            is_action: true
            component_name: sbomify Action
            component_id: Gu9wem8mkX
            lockfile: uv.lock
            sbom_format: cyclonedx
            output_file: sbomify-action.cdx.json
          - name: action-spdx
            kind: source
            is_action: true
            component_name: sbomify Action
            component_id: Gu9wem8mkX
            lockfile: uv.lock
            sbom_format: spdx
            output_file: sbomify-action.spdx.json
          - name: javascript-cyclonedx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            component_id: IxwrYSb9rGql
            lockfile: bun.lock
            sbom_format: cyclonedx
            output_file: sbomify-action-frontend.cdx.json
          - name: javascript-spdx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            component_id: IxwrYSb9rGql
            lockfile: bun.lock
            sbom_format: spdx
            output_file: sbomify-action-frontend.spdx.json
          - name: container-cyclonedx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            component_id: ryD0Hcu4vq6y
            sbom_format: cyclonedx
            output_file: sbomify-action-container.cdx.json
          - name: container-spdx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            component_id: ryD0Hcu4vq6y
            sbom_format: spdx
            output_file: sbomify-action-container.spdx.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .sbomify-cache
          key: sbomify-${{ runner.os }}
      - name: Generate additional packages from Dockerfile
        if: matrix.kind == 'container'
        run: ./scripts/generate_additional_packages.sh > container_additional_packages.txt
      # Derive version/docker_tag from the workflow_run payload. Under
      # workflow_run github.ref is the default branch, so the
      # determine-version action would always report a staging build —
      # replicate its logic against head_branch/head_sha instead.
      - id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [[ "$HEAD_BRANCH" == v* ]]; then
            echo "version=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "docker_tag=${HEAD_BRANCH#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "docker_tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: sbomify/sbomify-action@master
        env:
          COMPONENT_ID: ${{ matrix.component_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.version.outputs.version }}
          COMPONENT_PURL: ${{ (matrix.kind == 'container' || matrix.is_action) && format('pkg:docker/sbomify/sbomify-action@{0}?repository_url=ghcr.io', steps.version.outputs.docker_tag) || '' }}
          DOCKER_IMAGE: ${{ matrix.kind == 'container' && format('ghcr.io/sbomify/sbomify-action:{0}', steps.version.outputs.docker_tag) || '' }}
          LOCK_FILE: ${{ matrix.lockfile }}
          ADDITIONAL_PACKAGES_FILE: ${{ matrix.kind == 'container' && 'container_additional_packages.txt' || '' }}
          PRODUCT_RELEASE: '["IeIn1dGJXULh:${{ steps.version.outputs.version }}"]'
          SBOM_FORMAT: ${{ matrix.sbom_format }}
          UPLOAD: 'true'
          AUGMENT: 'true'
          ENRICH: 'true'
          OUTPUT_FILE: ${{ matrix.output_file }}
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache
          SYFT_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache/syft
      # ---------------------------------------------------------------------
      # Build-provenance attestation (SLSA v1)
      # ---------------------------------------------------------------------
      # Where this step is supported:
      #   * Public repository on any GitHub plan (Free, Pro, Team, Enterprise)
      #     — uses the public-good Sigstore instance (Fulcio + Rekor public log).
      #   * Private / internal repository on GitHub Enterprise Cloud
      #     — uses GitHub's private Sigstore instance (scoped to the repo).
      # Where it is NOT supported and the workflow will fail:
      #   * Private / internal repository on GitHub Free, Pro, or Team.
      #   * Any repository on GitHub Enterprise Server (self-hosted).
      # If you hit one of the unsupported configurations, either upgrade to
      # GitHub Enterprise Cloud, make the repo public, or remove this step.
      # Reference: https://github.com/actions/attest-build-provenance
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: '${{ github.workspace }}/${{ matrix.output_file }}'
