# Hand-maintained dogfood SBOM workflow for this repo.
#
# NOTE: this is NOT a wizard-generated file. Do not run `sbomify-action
# wizard` against it — the wizard owns `sboms.yml` and would overwrite this
# two-environment + container layout with its simpler single-environment
# form, silently dropping staging, production, and the container components.
#
# Migrated from the inline SBOM jobs that used to live in sbomify.yaml.
# Two environments, selected at runtime from the triggering ref:
#   * staging    — every push to master  -> stage.sbomify.com
#   * production — version tags (v*)      -> app.sbomify.com
#
# Container components generate an SBOM from the published ghcr image
# (ghcr.io/sbomify/sbomify-action:<tag>), which is built and pushed by the
# CI/CD Pipeline workflow's push-images job. To guarantee that image exists
# first, this workflow is gated on workflow_run — it only starts after
# CI/CD Pipeline completes successfully, the cross-workflow equivalent of
# `needs: push-images`. (Note: this requires the *whole* pipeline to be
# green, not just the image build.)
#
# Because it triggers on workflow_run, GitHub always runs the copy of this
# file on the repo's DEFAULT branch — changes only take effect once merged
# to master. Under workflow_run github.ref is the default branch (not the
# triggering tag), so version/docker_tag and the staging/production split
# are derived from the workflow_run payload in the `cfg` step below rather
# than github.ref / the determine-version action, and checkout pins
# head_sha so the workspace matches the built commit/tag.
name: sboms
on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
# Serialize runs per triggering ref so two master pushes (or re-runs of the
# same tag) don't race on the shared cache key or double-upload a version.
# Distinct tags get distinct groups and still run in parallel.
concurrency:
  group: sboms-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  sbom:
    name: ${{ matrix.name }}-${{ github.event.workflow_run.head_branch == 'master' && 'staging' || 'production' }}
    # Only for successful push-triggered pipeline runs (skips pull_request
    # runs). head_branch == 'master' -> staging; a v* tag -> production.
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'master'
          || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the GitHub OIDC JWT
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Each row carries both the staging and production component IDs;
        # the env block picks one based on steps.cfg.outputs.is_prod.
        include:
          - name: action-cyclonedx
            kind: source
            is_action: true
            component_name: sbomify Action
            staging_id: XNsX40tonzvv
            prod_id: Gu9wem8mkX
            lockfile: uv.lock
            sbom_format: cyclonedx
            output_file: sbomify-action.cdx.json
          - name: action-spdx
            kind: source
            is_action: true
            component_name: sbomify Action
            staging_id: XNsX40tonzvv
            prod_id: Gu9wem8mkX
            lockfile: uv.lock
            sbom_format: spdx
            output_file: sbomify-action.spdx.json
          - name: javascript-cyclonedx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            staging_id: PGyKXNbQd5eq
            prod_id: IxwrYSb9rGql
            lockfile: bun.lock
            sbom_format: cyclonedx
            output_file: sbomify-action-frontend.cdx.json
          - name: javascript-spdx
            kind: source
            is_action: false
            component_name: JavaScript Dependencies
            staging_id: PGyKXNbQd5eq
            prod_id: IxwrYSb9rGql
            lockfile: bun.lock
            sbom_format: spdx
            output_file: sbomify-action-frontend.spdx.json
          - name: container-cyclonedx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            staging_id: gco2pG10whmy
            prod_id: ryD0Hcu4vq6y
            sbom_format: cyclonedx
            output_file: sbomify-action-container.cdx.json
          - name: container-spdx
            kind: container
            is_action: false
            component_name: sbomify Action Container
            staging_id: gco2pG10whmy
            prod_id: ryD0Hcu4vq6y
            sbom_format: spdx
            output_file: sbomify-action-container.spdx.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .sbomify-cache
          key: sbomify-${{ runner.os }}
      - name: Generate additional packages from Dockerfile
        if: matrix.kind == 'container'
        run: ./scripts/generate_additional_packages.sh > container_additional_packages.txt
      # Resolve everything that depends on the triggering ref. Under
      # workflow_run github.ref is the default branch, so the
      # determine-version action would always report a staging build —
      # derive the version/docker_tag and the environment-specific endpoint,
      # audience and product-release id from head_branch/head_sha instead.
      - id: cfg
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          if [[ "$HEAD_BRANCH" == v* ]]; then
            # Production — version tag
            {
              echo "is_prod=true"
              echo "version=${HEAD_BRANCH}"
              echo "docker_tag=${HEAD_BRANCH#v}"
              echo "api_base_url=https://app.sbomify.com"
              echo "oidc_audience=sbomify.com"
              echo "product_release_id=IeIn1dGJXULh"
            } >> "$GITHUB_OUTPUT"
          else
            # Staging — master build
            {
              echo "is_prod=false"
              echo "version=${SHORT_SHA}"
              echo "docker_tag=latest"
              echo "api_base_url=https://stage.sbomify.com"
              echo "oidc_audience=stage.sbomify.com"
              echo "product_release_id=Engh9j4XTTwD"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: sbomify/sbomify-action@master
        env:
          API_BASE_URL: ${{ steps.cfg.outputs.api_base_url }}
          OIDC_AUDIENCE: ${{ steps.cfg.outputs.oidc_audience }}
          COMPONENT_ID: ${{ steps.cfg.outputs.is_prod == 'true' && matrix.prod_id || matrix.staging_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.cfg.outputs.version }}
          COMPONENT_PURL: ${{ (matrix.kind == 'container' || matrix.is_action) && format('pkg:docker/sbomify/sbomify-action@{0}?repository_url=ghcr.io', steps.cfg.outputs.docker_tag) || '' }}
          DOCKER_IMAGE: ${{ matrix.kind == 'container' && format('ghcr.io/sbomify/sbomify-action:{0}', steps.cfg.outputs.docker_tag) || '' }}
          LOCK_FILE: ${{ matrix.lockfile }}
          ADDITIONAL_PACKAGES_FILE: ${{ matrix.kind == 'container' && 'container_additional_packages.txt' || '' }}
          PRODUCT_RELEASE: '["${{ steps.cfg.outputs.product_release_id }}:${{ steps.cfg.outputs.version }}"]'
          SBOM_FORMAT: ${{ matrix.sbom_format }}
          UPLOAD: 'true'
          AUGMENT: 'true'
          ENRICH: 'true'
          OUTPUT_FILE: ${{ matrix.output_file }}
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache
          SYFT_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache/syft
      # ---------------------------------------------------------------------
      # Build-provenance attestation (SLSA v1)
      # ---------------------------------------------------------------------
      # Where this step is supported:
      #   * Public repository on any GitHub plan (Free, Pro, Team, Enterprise)
      #     — uses the public-good Sigstore instance (Fulcio + Rekor public log).
      #   * Private / internal repository on GitHub Enterprise Cloud
      #     — uses GitHub's private Sigstore instance (scoped to the repo).
      # Where it is NOT supported and the workflow will fail:
      #   * Private / internal repository on GitHub Free, Pro, or Team.
      #   * Any repository on GitHub Enterprise Server (self-hosted).
      # If you hit one of the unsupported configurations, either upgrade to
      # GitHub Enterprise Cloud, make the repo public, or remove this step.
      # Reference: https://github.com/actions/attest-build-provenance
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: '${{ github.workspace }}/${{ matrix.output_file }}'
