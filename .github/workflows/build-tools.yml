---
# Compile the external tools we ship, from the lockfiles that pin them, and
# publish them as our own attested artifacts.
#
# Previously we declared these tools in tools/go.mod and tools/Cargo.toml and
# then downloaded somebody else's prebuilt binary anyway -- the lockfiles only
# tracked versions. Building them here closes that gap: the binary the action
# fetches is the one produced from the dependency graph we publish an SBOM
# for, with build provenance attached.
#
# Where the artifacts land follows the release model:
#
#   push to master   the "tools-rolling" pre-release, replaced in place
#   published tag    release assets, immutable for the life of the release
#
# Both are needed, and a workflow artifact cannot stand in for the rolling
# half. Workflow artifacts require authentication even on a public repository
# (the download 401s) and expire after 90 days, so nothing outside the run
# that produced them can fetch one -- least of all a user running :latest.
# A pre-release gives master a stable, public, unauthenticated URL, which is
# what lets master exercise a bumped tool version before a release is cut.
# Cutting a release to find out whether a bump works is exactly backwards:
# the release is the thing the bump might break.
#
# Only tools that can be built from a lockfile are here. The JDK, Maven, the
# Go and Rust toolchains and cdxgen are upstream distributions, not things we
# compile, and stay pinned by digest in sbomify_action/tools.toml.
name: Build Tools

on:
  push:
    branches: [master]
    paths:
      - "tools/**"
      - ".github/workflows/build-tools.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rolling pre-release is created once, here, rather than by whichever
  # matrix job gets there first: eight jobs racing to create the same tag
  # means seven failures to swallow, and swallowing them would also hide a
  # real one.
  prepare-rolling:
    name: Ensure the rolling pre-release exists
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: tools-rolling
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Repoint the tag at the commit these binaries come from.
            gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false
          else
            gh release create "$TAG" \
              --title "Rolling tool builds (master)" \
              --notes "Tool binaries built from the lockfiles on master. Replaced on every push; not a supported download. Cut releases carry their own immutable copies." \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.tool }} (${{ matrix.slug }})
    needs: [prepare-rolling]
    # needs is skipped entirely on a release, so this must not gate on it.
    if: always() && (github.event_name == 'release' || needs.prepare-rolling.result == 'success')
    runs-on: ${{ matrix.runner }}
    permissions:
      # write, not read: the release path uploads the built binary as a
      # release asset, which read cannot do.
      contents: write
      id-token: write # OIDC identity for keyless attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: linux-amd64, runner: ubuntu-latest, goarch: amd64 }
          - { slug: linux-arm64, runner: ubuntu-24.04-arm, goarch: arm64 }
        tool:
          - syft
          - cosign
          - crane
          - cyclonedx-gomod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # setup-go caches both the module cache and the build cache, keyed on
      # the lockfile. Every tool in the matrix shares one go.sum, so a warm
      # cache from any of them speeds up the rest: unless a dependency is
      # bumped this is a cache hit and the compile is close to free. The
      # workflow itself only triggers on tools/** for the same reason.
      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: tools/go.sum

      - name: Resolve the pinned module path and version
        id: pin
        working-directory: tools
        run: |
          case "${{ matrix.tool }}" in
            syft)            MOD=github.com/anchore/syft;                     PKG=$MOD/cmd/syft ;;
            cosign)          MOD=github.com/sigstore/cosign/v3;               PKG=$MOD/cmd/cosign ;;
            crane)           MOD=github.com/google/go-containerregistry;      PKG=$MOD/cmd/crane ;;
            cyclonedx-gomod) MOD=github.com/CycloneDX/cyclonedx-gomod;        PKG=$MOD/cmd/cyclonedx-gomod ;;
            *) echo "unknown tool ${{ matrix.tool }}" >&2; exit 1 ;;
          esac
          VERSION=$(go list -m -f '{{ .Version }}' "$MOD")
          {
            echo "pkg=$PKG"
            echo "version=${VERSION#v}"
            echo "tag=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: tools
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          # syft leaves its version as "[not provided]" unless stamped, and the
          # SBOMs it produces record the generating tool's version -- an
          # unstamped build understates its own provenance. The others read it
          # from the module build info.
          LDFLAGS="-s -w"
          if [ "${{ matrix.tool }}" = "syft" ]; then
            LDFLAGS="$LDFLAGS -X main.version=${{ steps.pin.outputs.version }}"
            LDFLAGS="$LDFLAGS -X main.gitDescription=${{ steps.pin.outputs.tag }}"
          fi
          # -trimpath keeps runner paths out of the binary, so the build does
          # not depend on where it happened.
          go build -trimpath -ldflags="$LDFLAGS" \
            -o "../dist/${{ matrix.tool }}-${{ matrix.slug }}" "${{ steps.pin.outputs.pkg }}"

      - name: Smoke test
        run: |
          BIN="dist/${{ matrix.tool }}-${{ matrix.slug }}"
          test -x "$BIN"
          # Native arch only: an arm64 binary will not run on an amd64 runner.
          if [ "${{ matrix.goarch }}" = "$(dpkg --print-architecture)" ]; then
            "$BIN" version || "$BIN" --version
          fi
          sha256sum "$BIN" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2.2.3
        with:
          subject-path: dist/${{ matrix.tool }}-${{ matrix.slug }}

      # Publish the Sigstore bundle next to the binary it describes.
      #
      # GitHub keeps a copy behind its attestations API, but that is not a
      # usable fetch path here: the bundle now comes back through a redirect
      # to blob storage wrapped in an undocumented binary framing, and
      # depending on an unversioned internal format to verify a supply chain
      # is not a trade worth making. A release asset is plain, stable and
      # public, and cosign reads it directly.
      - name: Stage the attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/${{ matrix.tool }}-${{ matrix.slug }}.sigstore.json"

      # Kept for debugging a specific run. It is NOT the distribution channel:
      # see the header for why an artifact cannot serve that purpose.
      - name: Upload build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-${{ matrix.tool }}-${{ matrix.slug }}
          path: |
            dist/${{ matrix.tool }}-${{ matrix.slug }}
            dist/${{ matrix.tool }}-${{ matrix.slug }}.sigstore.json
          retention-days: 90
          if-no-files-found: error

      # Rolling master: one long-lived pre-release whose assets are replaced
      # on every push, so the download URL never changes and master can run
      # against a freshly bumped tool without a release being cut.
      #
      # Marked --prerelease so it never displaces the real latest release, and
      # --latest=false so tooling that asks for "the latest release" keeps
      # getting the cut one.
      - name: Publish to the rolling pre-release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: tools-rolling
        run: |
          gh release upload "$TAG" \
            "dist/${{ matrix.tool }}-${{ matrix.slug }}" \
            "dist/${{ matrix.tool }}-${{ matrix.slug }}.sigstore.json" --clobber

      # Cut release: immutable, publicly fetchable for as long as the release
      # exists, which is what a released image needs.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ matrix.tool }}-${{ matrix.slug }}" \
            "dist/${{ matrix.tool }}-${{ matrix.slug }}.sigstore.json" --clobber
