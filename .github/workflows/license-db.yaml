---
name: Generate License Databases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      distros:
        description: 'Distros to generate (comma-separated, or "all")'
        required: false
        default: 'all'

jobs:
  # The matrix is derived from the generator's own configuration rather than
  # duplicated here, so a new distro release cannot be added to the code and
  # silently never get a database built. See scripts/license_db_matrix.py.
  prepare-matrix:
    name: Resolve Distro Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract tool versions
        run: |
          source ./scripts/generate_additional_packages.sh
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Resolve matrix
        id: resolve
        env:
          DISTROS: ${{ github.event.inputs.distros || 'all' }}
        run: |
          MATRIX="$(uv run python scripts/license_db_matrix.py --distros "$DISTROS")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          uv run python scripts/license_db_matrix.py --distros "$DISTROS" --pretty

  generate-databases:
    name: Generate License Databases
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract tool versions
        run: |
          source ./scripts/generate_additional_packages.sh
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate ${{ matrix.distro }}-${{ matrix.version }} database
        run: |
          uv run sbomify-license-db \
            --distro ${{ matrix.distro }} \
            --version ${{ matrix.version }} \
            --output ${{ matrix.distro }}-${{ matrix.version }}.json.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-db-${{ matrix.distro }}-${{ matrix.version }}
          path: ${{ matrix.distro }}-${{ matrix.version }}.json.gz
          retention-days: 7

      - name: Get release tag
        id: get_tag
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${GH_EVENT_NAME}" = "release" ]; then
            echo "tag=${GH_RELEASE_TAG}" >> $GITHUB_OUTPUT
          else
            # For workflow_dispatch, get the latest release tag
            LATEST_TAG=$(curl -s "https://api.github.com/repos/${GH_REPOSITORY}/releases/latest" | jq -r .tag_name)
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi
          echo "Uploading to release: $(cat $GITHUB_OUTPUT | grep tag | cut -d= -f2)"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
          ASSET: ${{ matrix.distro }}-${{ matrix.version }}.json.gz
        run: |
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber
