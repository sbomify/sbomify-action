---
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows/ and action.yml. Any other directory is
    # scanned for its own *.yml files, so the copy-paste examples stay pinned
    # to current releases.
    directories:
      - "/"
      - "/examples/github"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "tests/test-data/**"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "tests/test-data/**"
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "tests/test-data/**"
    groups:
      docker:
        patterns:
          - "*"
