---
# Each hook runs the tool pinned in uv.lock, in the project's own venv, so the
# hooks and CI's Sanity Checks run the same versions against the same
# installed packages. Mirror hooks carried their own pins, which drifted from
# the lock, and mypy's isolated env lacked runtime deps such as
# packageurl-python, so it failed on a clean checkout.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy sbomify_action
        language: system
        types: [python]
        pass_filenames: false
