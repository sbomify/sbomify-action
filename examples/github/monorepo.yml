# Monorepo: one SBOM per package, one matrix job each. Every package is its own
# sbomify component; nothing is merged here. See docs/monorepo.md for why, and
# for the pitfalls. Copy to .github/workflows/ and edit the matrix.
name: SBOMs

on:
  push:
    branches: [main]
    tags: ['v*'] # a tag build is what PRODUCT_RELEASE below records as a release

permissions:
  contents: read
  # id-token: write  # sbomify trusted publishing (OIDC), instead of a TOKEN

jobs:
  sbom:
    name: sbom (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one broken package must not cancel the others' SBOMs
      matrix:
        include:
          - name: api
            dir: services/api
            lock_file: uv.lock
            component_id: your-api-component-id
          - name: web
            dir: services/web
            lock_file: package-lock.json
            component_id: your-web-component-id
          - name: worker
            dir: services/worker
            lock_file: go.mod
            component_id: your-worker-component-id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sbomify/sbomify-action@57ca9ba7de2232b073a3799bc8c0dc002e6777b9 # v26.10.2
        with:
          working-dir: ${{ matrix.dir }} # LOCK_FILE and OUTPUT_FILE resolve inside it
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
          OUTPUT_FILE: ${{ matrix.name }}.cdx.json
          COMPONENT_NAME: ${{ matrix.name }}
          ENRICH: 'true'
          UPLOAD: 'false' # 'true' to upload each package to its own component
          # TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          # COMPONENT_ID: ${{ matrix.component_id }}
          # PRODUCT_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && format('["your-product-id:{0}"]', github.ref_name) || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }} # artifact names must be unique per job
          path: ${{ matrix.dir }}/${{ matrix.name }}.cdx.json # written inside working-dir
          if-no-files-found: error
