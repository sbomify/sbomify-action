---
name: 'sbomify'
description: 'A GitHub Action to upload an SBOM CycloneDX or SPDX to sbomify'
author: 'sbomify'
inputs:
  working-dir:
    description: 'Working directory, relative to repo root or absolute (must be under $GITHUB_WORKSPACE). Example: packages/my-app'
    required: false
    default: ''
  component-purl:
    description: 'Override the component PURL in the SBOM (e.g., pkg:npm/@scope/name@1.0.0)'
    required: false
  bom-type:
    description: 'Artifact type to record on upload: sbom (default), vex, cbom or hbom. Only the sbomify destination supports non-SBOM types; other upload-destinations entries are rejected for them. Non-SBOM types are uploaded verbatim: augmentation, enrichment, overrides, additional-package injection and the SBOM-specific finalization fixups are skipped.'
    required: false
    default: 'sbom'
  oidc-audience:
    description: 'OIDC audience for trusted publishing (default: sbomify.com; override for self-hosted)'
    required: false
runs:
  using: 'docker'
  # Pinned by digest, and bumped with the release.
  #
  # A tag here is resolved when the step runs, so a consumer who pins
  # `sbomify/sbomify-action@<sha>` -- which is what SECURITY.md tells them to
  # do -- pins this file and nothing else: the image underneath it still
  # floats. The pin they believe they have does not exist. A digest is the
  # only reference that makes it real.
  #
  # `:latest` was also the wrong tag to float on: it is published before the
  # versioned tag, so it lags the release it is meant to represent.
  image: 'docker://ghcr.io/sbomify/sbomify-action:26.8.0@sha256:b89230442778f50a24b27b55b373cdbaad042f5ffb27d9af195e99ed3bd2e7bb'
  env:
    WORKING_DIR: ${{ inputs['working-dir'] }}
    COMPONENT_PURL: ${{ inputs['component-purl'] }}
    BOM_TYPE: ${{ inputs['bom-type'] }}
    OIDC_AUDIENCE: ${{ inputs['oidc-audience'] }}
branding:
  icon: 'upload-cloud'
  color: 'blue'
